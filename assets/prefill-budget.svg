<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-label="预算沿队头消费：A(7)、B(3)、C(5)"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#087e70"/></marker></defs><rect width="1100" height="460" fill="#f2f8f5"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="32" y="44" font-size="28" fill="#183b36">预算沿队头消费：A(7)、B(3)、C(5)</text><rect x="32" y="100" width="250" height="150" rx="12" fill="white" stroke="#087e70" stroke-width="2"/><text x="50" y="132" font-size="22" fill="#087e70">tick 1 · budget = 4</text><text x="50" y="165" font-size="18" fill="#183b36">A: 4</text><text x="50" y="194" font-size="18" fill="#183b36">computed A / B / C</text><text x="50" y="223" font-size="18" fill="#183b36">4 / 0 / 0</text><path d="M283 175 L299 175" stroke="#087e70" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="302" y="100" width="250" height="150" rx="12" fill="white" stroke="#087e70" stroke-width="2"/><text x="320" y="132" font-size="22" fill="#087e70">tick 2 · budget = 4</text><text x="320" y="165" font-size="18" fill="#183b36">A: 3 + B: 1</text><text x="320" y="194" font-size="18" fill="#183b36">computed A / B / C</text><text x="320" y="223" font-size="18" fill="#183b36">7 / 1 / 0</text><path d="M553 175 L569 175" stroke="#087e70" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="572" y="100" width="250" height="150" rx="12" fill="white" stroke="#087e70" stroke-width="2"/><text x="590" y="132" font-size="22" fill="#087e70">tick 3 · budget = 4</text><text x="590" y="165" font-size="18" fill="#183b36">B: 2 + C: 2</text><text x="590" y="194" font-size="18" fill="#183b36">computed A / B / C</text><text x="590" y="223" font-size="18" fill="#183b36">7 / 3 / 2</text><path d="M823 175 L839 175" stroke="#087e70" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="842" y="100" width="250" height="150" rx="12" fill="white" stroke="#087e70" stroke-width="2"/><text x="860" y="132" font-size="22" fill="#087e70">tick 4 · budget = 4</text><text x="860" y="165" font-size="18" fill="#183b36">C: 3（剩余1不用）</text><text x="860" y="194" font-size="18" fill="#183b36">computed A / B / C</text><text x="860" y="223" font-size="18" fill="#183b36">7 / 3 / 5</text><rect x="160" y="300" width="780" height="95" rx="12" fill="white" stroke="#087e70" stroke-width="2"/><text x="178" y="332" font-size="22" fill="#087e70">computed == prompt_length 才移到 running</text><text x="178" y="365" font-size="18" fill="#183b36">take = min(prompt_length − computed, budget)，两个上界缺一不可。</text><text x="32" y="436" font-size="18" fill="#183b36">第02课先完成全部 prefill，再做5次 decode：共9个逻辑tick。</text></g></svg>
