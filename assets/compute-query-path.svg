<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="626" viewBox="0 0 1100 626" role="img" aria-labelledby="title desc"><title id="title">低秩 query 与分组输出投影的形状</title><desc id="desc">查询从N乘H经过A投影变成N乘R，经过归一化和B投影变成N乘A乘D。注意力上下文按G组做Wv，然后输出投影回N乘H。低秩维R不等于KV压缩比。</desc><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1100" height="626" rx="18" fill="#f3f8f5" stroke="#d8e5de"/><text x="28" y="42" font-size="25" font-weight="700" fill="#183b36">query 降通道维；压缩 KV 缩短历史轴</text><text x="28" y="74" font-size="16" font-weight="400" fill="#526963">N 是本次 query 行数；H、R、A、D、G、O 分别来自模型配置，不预设某个 checkpoint。</text><rect x="28" y="108" width="200" height="138" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="29" y="109" width="5" height="136" rx="2" fill="#087e70" stroke="#087e70"/><text x="46" y="138" font-size="19" font-weight="650" fill="#183b36">hidden_states</text><text x="46" y="169" font-size="16" font-weight="400" fill="#183b36">[N, H]</text><text x="46" y="196" font-size="16" font-weight="400" fill="#183b36">本层 attention 输入</text><path d="M233,177 L282,177" fill="none" stroke="#087e70" stroke-width="2.5"/><polygon points="282,177 273.0,181.0 273.0,173.0" fill="#087e70"/><text x="240" y="150" font-size="15" font-weight="650" fill="#183b36">Wq.A</text><rect x="292" y="108" width="200" height="138" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="293" y="109" width="5" height="136" rx="2" fill="#087e70" stroke="#087e70"/><text x="310" y="138" font-size="19" font-weight="650" fill="#183b36">q_a</text><text x="310" y="169" font-size="16" font-weight="400" fill="#183b36">[N, R]</text><text x="310" y="196" font-size="16" font-weight="400" fill="#183b36">R = q_lora_rank</text><path d="M497,177 L580,177" fill="none" stroke="#087e70" stroke-width="2.5"/><polygon points="580,177 571.0,181.0 571.0,173.0" fill="#087e70"/><text x="505" y="146" font-size="15" font-weight="650" fill="#183b36">norm → B</text><rect x="590" y="108" width="208" height="138" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="591" y="109" width="5" height="136" rx="2" fill="#087e70" stroke="#087e70"/><text x="608" y="138" font-size="19" font-weight="650" fill="#183b36">q_b</text><text x="608" y="169" font-size="16" font-weight="400" fill="#183b36">[N, A × D]</text><text x="608" y="196" font-size="16" font-weight="400" fill="#183b36">可另带 index query</text><path d="M803,177 L850,177" fill="none" stroke="#087e70" stroke-width="2.5"/><polygon points="850,177 841.0,181.0 841.0,173.0" fill="#087e70"/><rect x="860" y="108" width="212" height="138" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="861" y="109" width="5" height="136" rx="2" fill="#087e70" stroke="#087e70"/><text x="878" y="138" font-size="19" font-weight="650" fill="#183b36">主 attention Q</text><text x="878" y="169" font-size="16" font-weight="400" fill="#183b36">[N, A, D]</text><text x="878" y="196" font-size="16" font-weight="400" fill="#183b36">norm / RoPE 可融合</text><rect x="28" y="270" width="1044" height="58" rx="12" fill="#fff5e5" stroke="#d7b77c"/><text x="46" y="305" font-size="18" font-weight="600" fill="#98651b">Q 的 N 没因低秩投影减少；KV 的 ratio 才描述压缩历史的另一个维度。</text><rect x="28" y="352" width="255" height="138" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="29" y="353" width="5" height="136" rx="2" fill="#087e70" stroke="#087e70"/><text x="46" y="382" font-size="19" font-weight="650" fill="#183b36">attention context</text><text x="46" y="413" font-size="16" font-weight="400" fill="#183b36">语义形状 [N, A, D]</text><text x="46" y="440" font-size="16" font-weight="400" fill="#183b36">分组 M = (A / G) × D</text><path d="M288,420 L335,420" fill="none" stroke="#087e70" stroke-width="2.5"/><polygon points="335,420 326.0,424.0 326.0,416.0" fill="#087e70"/><rect x="345" y="352" width="292" height="138" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="346" y="353" width="5" height="136" rx="2" fill="#087e70" stroke="#087e70"/><text x="363" y="382" font-size="19" font-weight="650" fill="#183b36">分组 Wv</text><text x="363" y="413" font-size="16" font-weight="400" fill="#183b36">输入 [N, G, M]</text><text x="363" y="440" font-size="16" font-weight="400" fill="#183b36">权重 [G, O, M]</text><path d="M642,420 L689,420" fill="none" stroke="#087e70" stroke-width="2.5"/><polygon points="689,420 680.0,424.0 680.0,416.0" fill="#087e70"/><rect x="699" y="352" width="373" height="138" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="700" y="353" width="5" height="136" rx="2" fill="#087e70" stroke="#087e70"/><text x="717" y="382" font-size="19" font-weight="650" fill="#183b36">输出投影</text><text x="717" y="413" font-size="16" font-weight="400" fill="#183b36">[N, G, O] → [N, G × O]</text><text x="717" y="440" font-size="16" font-weight="400" fill="#183b36">out_proj → [N, H]</text><text x="28" y="530" font-size="17" font-weight="600" fill="#183b36">只核对形状的小例子：N=2, H=4, R=2, A=2, D=2, G=1, O=2。</text><text x="28" y="562" font-size="17" font-weight="400" fill="#183b36">2×4 → 2×2 → 2×4 → 2×2×2；context 经 Wv 与 out_proj 回到 2×4。</text><text x="28" y="594" font-size="16" font-weight="400" fill="#526963">这组小维度是纸上示例，不是 DeepInfer 可运行配置，也不是 CPU 实验中的模型权重。</text></g></svg>
