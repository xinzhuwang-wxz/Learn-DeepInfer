<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="622" viewBox="0 0 1100 622" role="img" aria-labelledby="title desc"><title id="title">正确与错误的分页地址映射</title><desc id="desc">物理块0保存逻辑位置2和3，物理块1保存逻辑位置0和1。正确块表1,0恢复V身份。错误块表0,1不改变维度但使attention结果变成34.033130。</desc><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1100" height="622" rx="18" fill="#f3f8f5" stroke="#d8e5de"/><text x="28" y="42" font-size="25" font-weight="700" fill="#183b36">形状仍是 4×2，V 却已经换了身份</text><text x="28" y="74" font-size="16" font-weight="400" fill="#526963">CPU 参考：只把 V 分页；K 保持逻辑顺序。block_size = 2，block_table = [1, 0]。</text><rect x="28" y="109" width="290" height="171" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="29" y="110" width="5" height="169" rx="2" fill="#98651b" stroke="#98651b"/><text x="46" y="139" font-size="19" font-weight="650" fill="#183b36">physical block 0</text><text x="46" y="170" font-size="16" font-weight="400" fill="#183b36">保存逻辑位置 2、3</text><text x="46" y="197" font-size="16" font-weight="400" fill="#183b36">V₂ = [2, 2]</text><text x="46" y="224" font-size="16" font-weight="400" fill="#183b36">V₃ = [99, 99]</text><rect x="28" y="309" width="290" height="171" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="29" y="310" width="5" height="169" rx="2" fill="#087e70" stroke="#087e70"/><text x="46" y="339" font-size="19" font-weight="650" fill="#183b36">physical block 1</text><text x="46" y="370" font-size="16" font-weight="400" fill="#183b36">保存逻辑位置 0、1</text><text x="46" y="397" font-size="16" font-weight="400" fill="#183b36">V₀ = [1, 0]</text><text x="46" y="424" font-size="16" font-weight="400" fill="#183b36">V₁ = [0, 1]</text><rect x="389" y="109" width="274" height="171" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="390" y="110" width="5" height="169" rx="2" fill="#087e70" stroke="#087e70"/><text x="407" y="139" font-size="19" font-weight="650" fill="#183b36">逻辑 block 0 → 1</text><text x="407" y="170" font-size="16" font-weight="400" fill="#183b36">读 physical block 1</text><text x="407" y="197" font-size="16" font-weight="400" fill="#183b36">恢复逻辑位置 0、1</text><text x="407" y="224" font-size="16" font-weight="400" fill="#183b36">这两行 visible = [0, 1]</text><rect x="389" y="309" width="274" height="171" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="390" y="310" width="5" height="169" rx="2" fill="#98651b" stroke="#98651b"/><text x="407" y="339" font-size="19" font-weight="650" fill="#183b36">逻辑 block 1 → 0</text><text x="407" y="370" font-size="16" font-weight="400" fill="#183b36">读 physical block 0</text><text x="407" y="397" font-size="16" font-weight="400" fill="#183b36">恢复逻辑位置 2、3</text><text x="407" y="424" font-size="16" font-weight="400" fill="#183b36">本次不参加 attention</text><path d="M324,394 L381,196" fill="none" stroke="#087e70" stroke-width="2.5"/><polygon points="381,196 382.3540977312134,205.75532774099992 374.6663170636791,203.5421787609522" fill="#087e70"/><path d="M324,194 L381,394" fill="none" stroke="#98651b" stroke-width="2.5"/><polygon points="381,394 374.68640541641037,386.4409971931433 382.3800469501068,384.24830935603984" fill="#98651b"/><path d="M669,196 L718,196" fill="none" stroke="#087e70" stroke-width="2.5"/><polygon points="718,196 709.0,200.0 709.0,192.0" fill="#087e70"/><rect x="728" y="109" width="344" height="171" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="729" y="110" width="5" height="169" rx="2" fill="#087e70" stroke="#087e70"/><text x="746" y="139" font-size="19" font-weight="650" fill="#183b36">正确聚合</text><text x="746" y="170" font-size="16" font-weight="400" fill="#183b36">p = [0.669762, 0.330238]</text><text x="746" y="197" font-size="16" font-weight="400" fill="#183b36">V = [[1, 0], [0, 1]]</text><text x="746" y="224" font-size="16" font-weight="400" fill="#183b36">out ≈ [0.669762, 0.330238]</text><rect x="728" y="309" width="344" height="171" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="729" y="310" width="5" height="169" rx="2" fill="#a4473d" stroke="#a4473d"/><text x="746" y="339" font-size="19" font-weight="650" fill="#183b36">错用 block_table = [0, 1]</text><text x="746" y="370" font-size="16" font-weight="400" fill="#183b36">概率不变，但 V 读成 2、3</text><text x="746" y="397" font-size="16" font-weight="400" fill="#183b36">V = [[2, 2], [99, 99]]</text><text x="746" y="424" font-size="16" font-weight="400" fill="#183b36">out ≈ [34.033130, 34.033130]</text><rect x="28" y="514" width="1044" height="76" rx="12" fill="#e8f5ed" stroke="#bad2ca"/><text x="46" y="544" font-size="19" font-weight="650" fill="#183b36">visible 决定“可看谁”；block_table 决定“这个谁存在哪里”。</text><text x="46" y="573" font-size="16" font-weight="400" fill="#183b36">仅检查长度、二维 shape 和 softmax 归一性，拦不住这一类地址错误。</text></g></svg>
