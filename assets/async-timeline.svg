<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">A/B/C运行的尾部排空</title><desc id="desc">第13步采样B的e和C的tr，第14步只forward C但提交B和C旧结果，第15步不forward只flush C的ue；活引用从5到3再到0。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#087e70"/></marker></defs><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1000" height="680" rx="18" fill="#f3f8f5" stroke="#d8e5de"/><text x="28" y="42" font-size="25" font-weight="700" fill="#183b36">没有下一次 forward，也有最后一次提交</text><text x="28" y="74" font-size="16" font-weight="400" fill="#526963">A 已于第10步完成。以下完整追踪 B / C；每行右侧是该方法结束后的状态。</text><text x="28" y="117" font-size="16" font-weight="650" fill="#183b36">逻辑步</text><text x="148" y="117" font-size="16" font-weight="650" fill="#183b36">本轮 forward</text><text x="348" y="117" font-size="16" font-weight="650" fill="#183b36">提交 previous</text><text x="580" y="117" font-size="16" font-weight="650" fill="#183b36">新的 pending</text><text x="808" y="117" font-size="16" font-weight="650" fill="#183b36">输出 / 活引用</text><rect x="20" y="138" width="956" height="126" rx="12" fill="#fff" stroke="#bad2ca"/><text x="33" y="170" font-size="16" font-weight="650" fill="#183b36">13 · decode</text><text x="148" y="170" font-size="16" font-weight="400" fill="#183b36">B, C</text><text x="348" y="170" font-size="16" font-weight="400" fill="#183b36">B ← &#x27;ls&#x27;</text><text x="580" y="170" font-size="16" font-weight="400" fill="#183b36">B: &#x27;e&#x27;</text><text x="580" y="200" font-size="16" font-weight="400" fill="#183b36">C: &#x27;tr&#x27;</text><text x="808" y="170" font-size="16" font-weight="400" fill="#183b36">B: fals</text><text x="808" y="200" font-size="16" font-weight="400" fill="#183b36">C: ∅</text><text x="808" y="230" font-size="16" font-weight="400" fill="#183b36">引用和 5</text><path d="M305,200 L331,200" fill="none" stroke="#087e70" stroke-width="2.5"/><polygon points="331,200 322.0,204.0 322.0,196.0" fill="#087e70"/><path d="M537,200 L563,200" fill="none" stroke="#087e70" stroke-width="2.5"/><polygon points="563,200 554.0,204.0 554.0,196.0" fill="#087e70"/><rect x="20" y="280" width="956" height="126" rx="12" fill="#fff" stroke="#bad2ca"/><text x="33" y="312" font-size="16" font-weight="650" fill="#183b36">14 · decode</text><text x="148" y="312" font-size="16" font-weight="400" fill="#183b36">C</text><text x="148" y="342" font-size="16" font-weight="400" fill="#183b36">B 已无新位置</text><text x="348" y="312" font-size="16" font-weight="400" fill="#183b36">B ← &#x27;e&#x27;</text><text x="348" y="342" font-size="16" font-weight="400" fill="#183b36">C ← &#x27;tr&#x27;</text><text x="580" y="312" font-size="16" font-weight="400" fill="#183b36">C: &#x27;ue&#x27;</text><text x="808" y="312" font-size="16" font-weight="400" fill="#183b36">B: false</text><text x="808" y="342" font-size="16" font-weight="400" fill="#183b36">C: tr</text><text x="808" y="372" font-size="16" font-weight="400" fill="#183b36">引用和 3</text><path d="M305,342 L331,342" fill="none" stroke="#087e70" stroke-width="2.5"/><polygon points="331,342 322.0,346.0 322.0,338.0" fill="#087e70"/><path d="M537,342 L563,342" fill="none" stroke="#087e70" stroke-width="2.5"/><polygon points="563,342 554.0,346.0 554.0,338.0" fill="#087e70"/><rect x="20" y="422" width="956" height="126" rx="12" fill="#e8f5ed" stroke="#bad2ca"/><text x="33" y="454" font-size="16" font-weight="650" fill="#183b36">15 · flush</text><text x="148" y="454" font-size="16" font-weight="400" fill="#183b36">不启动</text><text x="348" y="454" font-size="16" font-weight="400" fill="#183b36">C ← &#x27;ue&#x27;</text><text x="580" y="454" font-size="16" font-weight="400" fill="#183b36">空</text><text x="808" y="454" font-size="16" font-weight="400" fill="#183b36">B: false</text><text x="808" y="484" font-size="16" font-weight="400" fill="#183b36">C: true</text><text x="808" y="514" font-size="16" font-weight="400" fill="#183b36">引用和 0</text><path d="M305,484 L331,484" fill="none" stroke="#087e70" stroke-width="2.5"/><polygon points="331,484 322.0,488.0 322.0,480.0" fill="#087e70"/><rect x="28" y="572" width="940" height="78" rx="12" fill="#fff5e5" stroke="#d7b77c"/><text x="47" y="602" font-size="19" font-weight="650" fill="#98651b">错误出口：在第14步后直接 return，只能返回 C = tr。</text><text x="47" y="630" font-size="15" font-weight="400" fill="#183b36">正确出口：先提交 pending 中的 ue，再验证 pending 为空、请求完成、教学引用归零。</text></g></svg>
