<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 435" role="img" aria-label="九个递进机制"><title>九个递进机制</title><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3z" fill="#087a64"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f0f7f3"/><text x="28" y="38" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#17342e" font-weight="600">同一批请求，每次只增加一个机制</text><rect x="28" y="65" width="260" height="78" rx="9" fill="white" stroke="#b9d3c7"/><text x="44" y="95" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#17342e" font-weight="600">01 请求身份</text><text x="44" y="121" font-family="Noto Sans CJK SC, sans-serif" font-size="12" fill="#526b64" font-weight="400">输出顺序不变量</text><line x1="291" y1="104" x2="308" y2="104" stroke="#087a64" stroke-width="2" marker-end="url(#arr)"/><rect x="313" y="65" width="260" height="78" rx="9" fill="white" stroke="#b9d3c7"/><text x="329" y="95" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#17342e" font-weight="600">02 分块预算</text><text x="329" y="121" font-family="Noto Sans CJK SC, sans-serif" font-size="12" fill="#526b64" font-weight="400">等待 → 运行</text><line x1="576" y1="104" x2="593" y2="104" stroke="#087a64" stroke-width="2" marker-end="url(#arr)"/><rect x="598" y="65" width="260" height="78" rx="9" fill="white" stroke="#b9d3c7"/><text x="614" y="95" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#17342e" font-weight="600">03 块所有权</text><text x="614" y="121" font-family="Noto Sans CJK SC, sans-serif" font-size="12" fill="#526b64" font-weight="400">暂时满 / 永远放不下</text><rect x="28" y="175" width="260" height="78" rx="9" fill="white" stroke="#b9d3c7"/><text x="44" y="205" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#17342e" font-weight="600">04 阶段投票</text><text x="44" y="231" font-family="Noto Sans CJK SC, sans-serif" font-size="12" fill="#526b64" font-weight="400">意愿 ≠ 可执行</text><line x1="291" y1="214" x2="308" y2="214" stroke="#087a64" stroke-width="2" marker-end="url(#arr)"/><rect x="313" y="175" width="260" height="78" rx="9" fill="white" stroke="#b9d3c7"/><text x="329" y="205" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#17342e" font-weight="600">05 验证预算</text><text x="329" y="231" font-family="Noto Sans CJK SC, sans-serif" font-size="12" fill="#526b64" font-weight="400">收益 / 成本</text><line x1="576" y1="214" x2="593" y2="214" stroke="#087a64" stroke-width="2" marker-end="url(#arr)"/><rect x="598" y="175" width="260" height="78" rx="9" fill="white" stroke="#b9d3c7"/><text x="614" y="205" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#17342e" font-weight="600">06 延迟提交</text><text x="614" y="231" font-family="Noto Sans CJK SC, sans-serif" font-size="12" fill="#526b64" font-weight="400">pending → flush</text><rect x="28" y="285" width="260" height="78" rx="9" fill="white" stroke="#b9d3c7"/><text x="44" y="315" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#17342e" font-weight="600">07 有界重放</text><text x="44" y="341" font-family="Noto Sans CJK SC, sans-serif" font-size="12" fill="#526b64" font-weight="400">保留可见域</text><line x1="291" y1="324" x2="308" y2="324" stroke="#087a64" stroke-width="2" marker-end="url(#arr)"/><rect x="313" y="285" width="260" height="78" rx="9" fill="white" stroke="#b9d3c7"/><text x="329" y="315" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#17342e" font-weight="600">08 语法回滚</text><text x="329" y="341" font-family="Noto Sans CJK SC, sans-serif" font-size="12" fill="#526b64" font-weight="400">token 与状态一起退</text><line x1="576" y1="324" x2="593" y2="324" stroke="#087a64" stroke-width="2" marker-end="url(#arr)"/><rect x="598" y="285" width="260" height="78" rx="9" fill="white" stroke="#b9d3c7"/><text x="614" y="315" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#17342e" font-weight="600">09 测量口径</text><text x="614" y="341" font-family="Noto Sans CJK SC, sans-serif" font-size="12" fill="#526b64" font-weight="400">验证量 ≠ 交付量</text><text x="28" y="407" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#526b64" font-weight="400">教学运行：Python 标准库 · 确定性 oracle · 无设备 · 不报告真实性能</text></svg>