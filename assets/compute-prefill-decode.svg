<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="666" viewBox="0 0 1100 666" role="img" aria-labelledby="title desc"><title id="title">prefill与decode不同的缓存读取接口</title><desc id="desc">Prefill把历史SWA、当前SWA和压缩缓存拼入连续BF16工作视图，压缩索引需要加主KV偏移。Decode使用SWA与压缩缓存各自的物理索引以及FlashMLA调度元数据。YoCo查询收缩不替代完整KV更新。</desc><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1100" height="666" rx="18" fill="#f3f8f5" stroke="#d8e5de"/><text x="28" y="42" font-size="25" font-weight="700" fill="#183b36">prefill 拼一个工作视图；decode 按索引读缓存</text><text x="28" y="74" font-size="17" font-weight="400" fill="#526963">两种接口都需要正确的可见集合，但索引对应的地址空间不同。</text><text x="28" y="119" font-size="19" font-weight="700" fill="#087e70">PREFILL · 示例行数</text><rect x="28" y="140" width="230" height="115" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="29" y="141" width="5" height="113" rx="2" fill="#087e70" stroke="#087e70"/><text x="46" y="170" font-size="19" font-weight="650" fill="#183b36">历史 SWA</text><text x="46" y="201" font-size="16" font-weight="400" fill="#183b36">2 行 → kv[0:2]</text><rect x="280" y="140" width="230" height="115" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="281" y="141" width="5" height="113" rx="2" fill="#087e70" stroke="#087e70"/><text x="298" y="170" font-size="19" font-weight="650" fill="#183b36">当前 SWA</text><text x="298" y="201" font-size="16" font-weight="400" fill="#183b36">2 行 → kv[2:4]</text><rect x="532" y="140" width="230" height="115" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="533" y="141" width="5" height="113" rx="2" fill="#087e70" stroke="#087e70"/><text x="550" y="170" font-size="19" font-weight="650" fill="#183b36">compressed cache</text><text x="550" y="201" font-size="16" font-weight="400" fill="#183b36">3 行 → kv[4:7]</text><path d="M770,197 L812,197" fill="none" stroke="#087e70" stroke-width="2.5"/><polygon points="812,197 803.0,201.0 803.0,193.0" fill="#087e70"/><rect x="822" y="140" width="250" height="115" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="823" y="141" width="5" height="113" rx="2" fill="#087e70" stroke="#087e70"/><text x="840" y="170" font-size="19" font-weight="650" fill="#183b36">连续 BF16 工作视图</text><text x="840" y="201" font-size="16" font-weight="400" fill="#183b36">kv.shape = [7, 1, D]</text><text x="28" y="288" font-size="17" font-weight="600" fill="#183b36">main_kv_offset = 2 + 2 = 4；compressed 第 1 行进入 kv 后是第 5 行。</text><text x="28" y="318" font-size="16" font-weight="400" fill="#526963">kv_index_cat 把 SWA 与压缩索引放进同一工作视图；不能遗漏这个偏移。</text><text x="28" y="369" font-size="19" font-weight="700" fill="#365c91">DECODE · 保留缓存布局</text><rect x="28" y="392" width="355" height="135" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="29" y="393" width="5" height="133" rx="2" fill="#365c91" stroke="#365c91"/><text x="46" y="422" font-size="19" font-weight="650" fill="#183b36">SWA cache + kv_swa_index</text><text x="46" y="453" font-size="16" font-weight="400" fill="#183b36">按序列 state slot / 窗口定位</text><text x="46" y="480" font-size="16" font-weight="400" fill="#183b36">不是 prefill 工作视图的行号</text><rect x="405" y="392" width="355" height="135" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="406" y="393" width="5" height="133" rx="2" fill="#365c91" stroke="#365c91"/><text x="423" y="422" font-size="19" font-weight="650" fill="#183b36">ca_cache + kv_ca_index</text><text x="423" y="453" font-size="16" font-weight="400" fill="#183b36">按压缩页与物理索引定位</text><text x="423" y="480" font-size="16" font-weight="400" fill="#183b36">连同 FlashMLA schedule metadata</text><path d="M770,456 L812,456" fill="none" stroke="#365c91" stroke-width="2.5"/><polygon points="812,456 803.0,460.0 803.0,452.0" fill="#365c91"/><rect x="822" y="392" width="250" height="135" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="823" y="393" width="5" height="133" rx="2" fill="#365c91" stroke="#365c91"/><text x="840" y="422" font-size="19" font-weight="650" fill="#183b36">decode kernel</text><text x="840" y="453" font-size="16" font-weight="400" fill="#183b36">读两套缓存 / 索引</text><text x="840" y="480" font-size="16" font-weight="400" fill="#183b36">输出 context</text><rect x="28" y="557" width="1044" height="77" rx="12" fill="#fff5e5" stroke="#d7b77c"/><text x="46" y="588" font-size="18" font-weight="650" fill="#98651b">YoCo compact：query 可变短，main / index KV 仍由 full hidden 更新。</text><text x="46" y="617" font-size="16" font-weight="400" fill="#183b36">图中 2 + 2 + 3 仅解释缓冲区地址；不是对某个请求的压缩输出数作预测。</text></g></svg>
