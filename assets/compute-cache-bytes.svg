<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="677" viewBox="0 0 1100 677" role="img" aria-labelledby="title desc"><title id="title">缓存data与scale的两种排列</title><desc id="desc">V41 FP8每行512字节数据加16字节scale，FP4 main每行256字节数据加32字节scale。两行FP4 index的块先放128字节数据再放8字节scale，4D uint8视图不意味着token交错记录。</desc><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1100" height="677" rx="18" fill="#f3f8f5" stroke="#d8e5de"/><text x="28" y="42" font-size="25" font-weight="700" fill="#183b36">data 和 scale 不只要一起数，还要按正确顺序找</text><text x="28" y="74" font-size="16" font-weight="400" fill="#526963">以下偏移都从 0 开始；区间含两端。示意框宽不按字节比例。</text><text x="28" y="119" font-size="19" font-weight="700" fill="#087e70">Main / SWA：每个 token 自带 data | scale</text><rect x="28" y="140" width="666" height="76" rx="12" fill="#e8f5ed" stroke="#bad2ca"/><rect x="694" y="140" width="378" height="76" rx="12" fill="#fff5e5" stroke="#d7b77c"/><text x="47" y="170" font-size="18" font-weight="650" fill="#183b36">V41_FORMAT · 512 个 FP8 · 512B</text><text x="47" y="199" font-size="16" font-weight="400" fill="#183b36">data offset 0…511</text><text x="712" y="170" font-size="18" font-weight="650" fill="#98651b">16 个 UE8M0 · 16B</text><text x="712" y="199" font-size="16" font-weight="400" fill="#183b36">scale offset 512…527；共 528B</text><rect x="28" y="239" width="666" height="76" rx="12" fill="#e8f5ed" stroke="#bad2ca"/><rect x="694" y="239" width="378" height="76" rx="12" fill="#fff5e5" stroke="#d7b77c"/><text x="47" y="269" font-size="18" font-weight="650" fill="#183b36">V41_FP4_FORMAT · 512 个 FP4 · 256B</text><text x="47" y="298" font-size="16" font-weight="400" fill="#183b36">data offset 0…255</text><text x="712" y="269" font-size="18" font-weight="650" fill="#98651b">32 个 E4M3 · 32B</text><text x="712" y="298" font-size="16" font-weight="400" fill="#183b36">scale offset 256…287；共 288B</text><text x="28" y="364" font-size="19" font-weight="700" fill="#365c91">FP4 index：一个含 2 行的 block，先存全部 data，再存全部 scale</text><rect x="28" y="390" width="350" height="84" rx="12" fill="#edf2fa" stroke="#bad2ca"/><text x="40" y="423" font-size="16" font-weight="650" fill="#365c91">token 0 data · 64B</text><text x="40" y="454" font-size="15" font-weight="400" fill="#183b36">offset 0…63</text><rect x="378" y="390" width="350" height="84" rx="12" fill="#edf2fa" stroke="#bad2ca"/><text x="390" y="423" font-size="16" font-weight="650" fill="#365c91">token 1 data · 64B</text><text x="390" y="454" font-size="15" font-weight="400" fill="#183b36">offset 64…127</text><rect x="728" y="390" width="172" height="84" rx="12" fill="#fff5e5" stroke="#bad2ca"/><text x="740" y="423" font-size="16" font-weight="650" fill="#98651b">token 0 scale</text><text x="740" y="454" font-size="15" font-weight="400" fill="#183b36">128…131 · 4B</text><rect x="900" y="390" width="172" height="84" rx="12" fill="#fff5e5" stroke="#bad2ca"/><text x="912" y="423" font-size="16" font-weight="650" fill="#98651b">token 1 scale</text><text x="912" y="454" font-size="15" font-weight="400" fill="#183b36">132…135 · 4B</text><text x="28" y="511" font-size="17" font-weight="600" fill="#183b36">形状可以写成 [num_blocks, 2, 1, 68]；不能因此把每个 68B 切片当成完整 token。</text><text x="28" y="545" font-size="17" font-weight="400" fill="#183b36">split_kv_cache 按 block 划 data / scale；main / SWA 才按 token 拆两部分。</text><rect x="28" y="577" width="1044" height="70" rx="12" fill="#fff5e5" stroke="#d7b77c"/><text x="46" y="606" font-size="18" font-weight="650" fill="#98651b">528、288、68 是相应格式的单行 payload，不是服务的“每 token 总显存”。</text><text x="46" y="633" font-size="16" font-weight="400" fill="#183b36">整块对齐、层数、压缩比、共享、FP32 压缩 state 和其它工作区还要另算。</text></g></svg>
