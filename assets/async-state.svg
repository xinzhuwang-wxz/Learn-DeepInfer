<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">pending、输出与块引用的区别</title><desc id="desc">第8步后A的output是tr，pending是A的ue，三个块仍由A持有。下一次decode跳过A采样但提交它的旧结果，然后结束并释放教学引用。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#087e70"/></marker></defs><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="960" height="600" rx="18" fill="#f3f8f5" stroke="#d8e5de"/><text x="28" y="42" font-size="25" font-weight="700" fill="#183b36">一个请求，三份不能混在一起的状态</text><text x="28" y="73" font-size="17" font-weight="400" fill="#526963">第8步结束后的 A：已经产生 true，但只提交了 tr。</text><rect x="28" y="108" width="270" height="174" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="29" y="109" width="5" height="172" rx="2" fill="#087e70" stroke="#087e70"/><text x="48" y="140" font-size="20" font-weight="650" fill="#183b36">已提交 · A.output</text><text x="48" y="173" font-size="16" font-weight="400" fill="#183b36">&#x27;tr&#x27;</text><text x="48" y="201" font-size="16" font-weight="400" fill="#183b36">len(output) = 2</text><text x="48" y="229" font-size="16" font-weight="400" fill="#183b36">emit() 才能追加</text><rect x="336" y="108" width="294" height="174" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="337" y="109" width="5" height="172" rx="2" fill="#98651b" stroke="#98651b"/><text x="356" y="140" font-size="20" font-weight="650" fill="#183b36">在途 · pending</text><text x="356" y="173" font-size="16" font-weight="400" fill="#183b36">[(A, &#x27;ue&#x27;)]</text><text x="356" y="201" font-size="16" font-weight="400" fill="#183b36">属于 A 的在途长度 = 2</text><text x="356" y="229" font-size="16" font-weight="400" fill="#183b36">decode() 采样后保存</text><rect x="668" y="108" width="264" height="174" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="669" y="109" width="5" height="172" rx="2" fill="#087e70" stroke="#087e70"/><text x="688" y="140" font-size="20" font-weight="650" fill="#183b36">资源 · A.blocks</text><text x="688" y="173" font-size="16" font-weight="400" fill="#183b36">[1, 2, 3]</text><text x="688" y="201" font-size="16" font-weight="400" fill="#183b36">3 个引用仍然存活</text><text x="688" y="229" font-size="16" font-weight="400" fill="#183b36">提交结束后才归还</text><path d="M298,198 L330,198" fill="none" stroke="#087e70" stroke-width="2.5"/><polygon points="330,198 321.0,202.0 321.0,194.0" fill="#087e70"/><text x="264" y="319" font-size="20" font-weight="650" fill="#183b36">下一位置 = 已提交长度 2 + 在途长度 2 = 4</text><text x="28" y="357" font-size="17" font-weight="400" fill="#526963">下一次 decode：A 不再参与采样，但 previous 里的 A 结果仍要提交。</text><rect x="28" y="390" width="288" height="138" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="29" y="391" width="5" height="136" rx="2" fill="#087e70" stroke="#087e70"/><text x="48" y="422" font-size="20" font-weight="650" fill="#183b36">① 移交旧 batch</text><text x="48" y="455" font-size="16" font-weight="400" fill="#183b36">previous ← pending</text><text x="48" y="483" font-size="16" font-weight="400" fill="#183b36">pending ← []</text><path d="M320,458 L350,458" fill="none" stroke="#087e70" stroke-width="2.5"/><polygon points="350,458 341.0,462.0 341.0,454.0" fill="#087e70"/><rect x="358" y="390" width="268" height="138" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="359" y="391" width="5" height="136" rx="2" fill="#087e70" stroke="#087e70"/><text x="378" y="422" font-size="20" font-weight="650" fill="#183b36">② 提交给原请求</text><text x="378" y="455" font-size="16" font-weight="400" fill="#183b36">emit(A, &#x27;ue&#x27;)</text><text x="378" y="483" font-size="16" font-weight="400" fill="#183b36">A.output = &#x27;true&#x27;</text><path d="M630,458 L660,458" fill="none" stroke="#087e70" stroke-width="2.5"/><polygon points="660,458 651.0,462.0 651.0,454.0" fill="#087e70"/><rect x="668" y="390" width="264" height="138" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="669" y="391" width="5" height="136" rx="2" fill="#087e70" stroke="#087e70"/><text x="688" y="422" font-size="20" font-weight="650" fill="#183b36">③ 结束 A</text><text x="688" y="455" font-size="16" font-weight="400" fill="#183b36">finished 加入 A</text><text x="688" y="483" font-size="16" font-weight="400" fill="#183b36">块 1、2、3 引用归零</text><text x="28" y="570" font-size="16" font-weight="400" fill="#526963">教学块只表示引用与复用资格；不是实际 KV tensor，也没有测量 GPU 时间。</text></g></svg>
