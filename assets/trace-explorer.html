<div class="trace-lab" data-trace-lab>
<label for="trace-case">运行记录</label>
<select id="trace-case"></select>
<div class="trace-controls"><button id="trace-prev">上一步</button><button id="trace-next">下一步</button><button id="trace-reset">重置</button></div>
<label for="trace-position">事件位置</label><input type="range" id="trace-position" min="0" max="1" value="0">
<p id="trace-status" aria-live="polite"></p><div id="trace-requests"></div><div id="trace-blocks"></div><pre id="trace-event"></pre>
</div>
