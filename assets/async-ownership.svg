<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="676" viewBox="0 0 1000 676" role="img" aria-labelledby="title desc"><title id="title">池中输出记录与调用者副本以及KV块的不同生命周期</title><desc id="desc">RequestOutput.clone复制地址指向的记录，而不是复制地址。KV块引用是单独账本。Python字典别名实验说明共享可变对象，不能把真实失效C++指针当作安全可读的旧字典。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#087e70"/></marker></defs><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1000" height="676" rx="18" fill="#f3f8f5" stroke="#d8e5de"/><text x="28" y="42" font-size="25" font-weight="700" fill="#183b36">输出记录与 KV 块，不是同一份所有权</text><text x="28" y="73" font-size="16" font-weight="400" fill="#526963">DeepInfer 固定源码的生命周期边界；下方字典探针只做安全类比。</text><rect x="28" y="110" width="288" height="170" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="29" y="111" width="5" height="168" rx="2" fill="#087e70" stroke="#087e70"/><text x="48" y="142" font-size="20" font-weight="650" fill="#183b36">引擎输出池</text><text x="48" y="175" font-size="16" font-weight="400" fill="#183b36">RequestOutput 记录</text><text x="48" y="203" font-size="16" font-weight="400" fill="#183b36">raw_output 是 uint64 地址</text><text x="48" y="231" font-size="16" font-weight="400" fill="#183b36">后续 step 可释放 / 复用</text><path d="M320,193 L379,193" fill="none" stroke="#087e70" stroke-width="2.5"/><polygon points="379,193 370.0,197.0 370.0,189.0" fill="#087e70"/><text x="338" y="170" font-size="15" font-weight="650" fill="#087e70">clone</text><rect x="388" y="110" width="312" height="170" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="389" y="111" width="5" height="168" rx="2" fill="#087e70" stroke="#087e70"/><text x="408" y="142" font-size="20" font-weight="650" fill="#183b36">调用者拥有的副本</text><text x="408" y="175" font-size="16" font-weight="400" fill="#183b36">RequestOutput.clone(raw_output)</text><text x="408" y="203" font-size="16" font-weight="400" fill="#183b36">保存进 outputs[request_id]</text><text x="408" y="231" font-size="16" font-weight="400" fill="#183b36">不是只复制地址数组</text><rect x="736" y="110" width="236" height="170" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="737" y="111" width="5" height="168" rx="2" fill="#087e70" stroke="#087e70"/><text x="756" y="142" font-size="20" font-weight="650" fill="#183b36">另一本账：KV块</text><text x="756" y="175" font-size="16" font-weight="400" fill="#183b36">引用 / pin 计数</text><text x="756" y="203" font-size="16" font-weight="400" fill="#183b36">归零后可复用槽位</text><text x="756" y="231" font-size="16" font-weight="400" fill="#183b36">不是释放 GPU tensor</text><rect x="28" y="314" width="944" height="52" rx="12" fill="#e9f3ef" stroke="#c8dbd2"/><text x="47" y="346" font-size="17" font-weight="600" fill="#183b36">flush 排空在途状态；不能由此推出所有输出池、metadata、KV 存储都已释放。</text><text x="28" y="410" font-size="21" font-weight="650" fill="#183b36">Python 别名探针：两个名字可以指向同一对象</text><rect x="28" y="440" width="288" height="160" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="29" y="441" width="5" height="158" rx="2" fill="#087e70" stroke="#087e70"/><text x="48" y="472" font-size="20" font-weight="650" fill="#183b36">同一个字典</text><text x="48" y="505" font-size="16" font-weight="400" fill="#183b36">pool = {&#x27;token&#x27;: 10}</text><text x="48" y="533" font-size="16" font-weight="400" fill="#183b36">borrowed = pool</text><text x="48" y="561" font-size="16" font-weight="400" fill="#183b36">修改 pool[&#x27;token&#x27;] = 11</text><path d="M320,517 L379,517" fill="none" stroke="#087e70" stroke-width="2.5"/><polygon points="379,517 370.0,521.0 370.0,513.0" fill="#087e70"/><rect x="388" y="440" width="270" height="160" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="389" y="441" width="5" height="158" rx="2" fill="#98651b" stroke="#98651b"/><text x="408" y="472" font-size="20" font-weight="650" fill="#183b36">borrowed 的结果</text><text x="408" y="505" font-size="16" font-weight="400" fill="#183b36">仍指向原字典</text><text x="408" y="533" font-size="16" font-weight="400" fill="#183b36">读到 11</text><rect x="696" y="440" width="276" height="160" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="697" y="441" width="5" height="158" rx="2" fill="#087e70" stroke="#087e70"/><text x="716" y="472" font-size="20" font-weight="650" fill="#183b36">owned 的结果</text><text x="716" y="505" font-size="16" font-weight="400" fill="#183b36">修改前 deepcopy(pool)</text><text x="716" y="533" font-size="16" font-weight="400" fill="#183b36">独立副本仍是 10</text><text x="28" y="644" font-size="16" font-weight="400" fill="#a4473d">真实 C++ 旧地址失效后不能安全读取；不保证它只是“变成下一个 token”。</text></g></svg>
