<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="712" viewBox="0 0 1040 712" role="img" aria-labelledby="title desc"><title id="title">布尔字符语法状态机与回退</title><desc id="desc">初始允许t或f，两条路径分别形成true和false。true路径的tru只允许e；回退两个字符后变为t并允许r。只撤销输出而不回退matcher会错误拒绝r。EOS不记录在教学历史中。</desc><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1040" height="712" rx="18" fill="#f3f8f5" stroke="#d8e5de"/><text x="28" y="42" font-size="25" font-weight="700" fill="#183b36">matcher 保存的是前缀，不是最后一次的允许集合</text><text x="28" y="74" font-size="16" font-weight="400" fill="#526963">字符级语言只有 true / false。每次 allowed() 都由当前 prefix 重新计算。</text><rect x="28" y="218" width="128" height="82" rx="10" fill="#fff" stroke="#bad2ca"/><text x="43" y="248" font-size="20" font-weight="650" fill="#183b36">空串</text><text x="43" y="278" font-size="15" font-weight="400" fill="#526963">允许 t / f</text><rect x="220" y="126" width="128" height="82" rx="10" fill="#fff" stroke="#bad2ca"/><text x="235" y="156" font-size="20" font-weight="650" fill="#183b36">t</text><text x="235" y="186" font-size="15" font-weight="400" fill="#526963">允许 r</text><rect x="408" y="126" width="128" height="82" rx="10" fill="#fff" stroke="#bad2ca"/><text x="423" y="156" font-size="20" font-weight="650" fill="#183b36">tr</text><text x="423" y="186" font-size="15" font-weight="400" fill="#526963">允许 u</text><rect x="596" y="126" width="128" height="82" rx="10" fill="#fff" stroke="#bad2ca"/><text x="611" y="156" font-size="20" font-weight="650" fill="#183b36">tru</text><text x="611" y="186" font-size="15" font-weight="400" fill="#526963">允许 e</text><rect x="784" y="126" width="128" height="82" rx="10" fill="#e1f2e9" stroke="#087e70"/><text x="799" y="156" font-size="20" font-weight="650" fill="#183b36">true</text><text x="799" y="186" font-size="15" font-weight="400" fill="#526963">允许 &lt;eos&gt;</text><rect x="220" y="310" width="128" height="82" rx="10" fill="#fff" stroke="#bad2ca"/><text x="235" y="340" font-size="20" font-weight="650" fill="#183b36">f</text><text x="235" y="370" font-size="15" font-weight="400" fill="#526963">允许 a</text><rect x="386" y="310" width="128" height="82" rx="10" fill="#fff" stroke="#bad2ca"/><text x="401" y="340" font-size="20" font-weight="650" fill="#183b36">fa</text><text x="401" y="370" font-size="15" font-weight="400" fill="#526963">允许 l</text><rect x="552" y="310" width="128" height="82" rx="10" fill="#fff" stroke="#bad2ca"/><text x="567" y="340" font-size="20" font-weight="650" fill="#183b36">fal</text><text x="567" y="370" font-size="15" font-weight="400" fill="#526963">允许 s</text><rect x="718" y="310" width="128" height="82" rx="10" fill="#fff" stroke="#bad2ca"/><text x="733" y="340" font-size="20" font-weight="650" fill="#183b36">fals</text><text x="733" y="370" font-size="15" font-weight="400" fill="#526963">允许 e</text><rect x="884" y="310" width="128" height="82" rx="10" fill="#e1f2e9" stroke="#087e70"/><text x="899" y="340" font-size="20" font-weight="650" fill="#183b36">false</text><text x="899" y="370" font-size="15" font-weight="400" fill="#526963">允许 &lt;eos&gt;</text><path d="M159,239 L211,172" stroke="#087e70" stroke-width="2.5" fill="none"/><polygon points="211,172 208.6418307850296,181.56237616670492 202.32193728890897,176.6573841995665" fill="#087e70"/><path d="M159,276 L211,348" stroke="#087e70" stroke-width="2.5" fill="none"/><polygon points="211,348 202.48786810180124,343.04584915977847 208.9733019290003,338.36192472902366" fill="#087e70"/><path d="M352,168 L400,168" stroke="#087e70" stroke-width="2.5" fill="none"/><polygon points="400,168 391.0,172.0 391.0,164.0" fill="#087e70"/><path d="M540,168 L588,168" stroke="#087e70" stroke-width="2.5" fill="none"/><polygon points="588,168 579.0,172.0 579.0,164.0" fill="#087e70"/><path d="M728,168 L776,168" stroke="#087e70" stroke-width="2.5" fill="none"/><polygon points="776,168 767.0,172.0 767.0,164.0" fill="#087e70"/><path d="M352,351 L380,351" stroke="#087e70" stroke-width="2.5" fill="none"/><polygon points="380,351 371.0,355.0 371.0,347.0" fill="#087e70"/><path d="M518,351 L546,351" stroke="#087e70" stroke-width="2.5" fill="none"/><polygon points="546,351 537.0,355.0 537.0,347.0" fill="#087e70"/><path d="M684,351 L712,351" stroke="#087e70" stroke-width="2.5" fill="none"/><polygon points="712,351 703.0,355.0 703.0,347.0" fill="#087e70"/><path d="M850,351 L878,351" stroke="#087e70" stroke-width="2.5" fill="none"/><polygon points="878,351 869.0,355.0 869.0,347.0" fill="#087e70"/><text x="28" y="436" font-size="21" font-weight="650" fill="#183b36">撤销草稿 ru：prefix 从 tru 回到 t，允许集合从 {e} 恢复为 {r}。</text><rect x="28" y="464" width="464" height="145" rx="10" fill="#fff" stroke="#bad2ca"/><rect x="29" y="465" width="5" height="143" rx="2" fill="#087e70" stroke="#087e70"/><text x="47" y="496" font-size="20" font-weight="650" fill="#183b36">正确：输出与 matcher 一起撤回</text><text x="47" y="528" font-size="16" font-weight="400" fill="#183b36">输出：tru → t</text><text x="47" y="556" font-size="16" font-weight="400" fill="#183b36">matcher：tru → t</text><text x="47" y="584" font-size="16" font-weight="400" fill="#183b36">下一轮 r 可以被接受。</text><rect x="520" y="464" width="492" height="145" rx="10" fill="#fff" stroke="#bad2ca"/><rect x="521" y="465" width="5" height="143" rx="2" fill="#a4473d" stroke="#a4473d"/><text x="539" y="496" font-size="20" font-weight="650" fill="#183b36">错误：只撤销输出</text><text x="539" y="528" font-size="16" font-weight="400" fill="#183b36">输出：tru → t</text><text x="539" y="556" font-size="16" font-weight="400" fill="#183b36">matcher：仍停在 tru</text><text x="539" y="584" font-size="16" font-weight="400" fill="#183b36">下一轮 r 被错误拒绝，因为它还在等 e。</text><text x="28" y="650" font-size="17" font-weight="600" fill="#183b36">单字符拒绝不改变 prefix；rollback(0) 不改变 prefix；越界回退必须显式报错。</text><text x="28" y="684" font-size="16" font-weight="400" fill="#526963">&lt;eos&gt; 在这个 toy 中不写入历史，不记录终止状态；不能用它验证真实 EOS 后的回退。</text></g></svg>
