<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-label="意愿不是调度成功：两轮检查保护前进路径"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#087e70"/></marker></defs><rect width="1100" height="460" fill="#f2f8f5"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="32" y="44" font-size="28" fill="#183b36">意愿不是调度成功：两轮检查保护前进路径</text><rect x="32" y="90" width="300" height="140" rx="12" fill="white" stroke="#087e70" stroke-width="2"/><text x="50" y="122" font-size="22" fill="#087e70">第一票：是否尝试？</text><text x="50" y="155" font-size="18" fill="#183b36">ALL点：all(wants)</text><text x="50" y="184" font-size="18" fill="#183b36">ANY点：any(wants)</text><text x="50" y="213" font-size="18" fill="#183b36">重合时ANY优先</text><rect x="402" y="90" width="300" height="140" rx="12" fill="white" stroke="#087e70" stroke-width="2"/><text x="420" y="122" font-size="22" fill="#087e70">第二票：谁真的能做？</text><text x="420" y="155" font-size="18" fill="#183b36">actual = any(want and can)</text><text x="420" y="184" font-size="18" fill="#183b36">必须按同一rank配对</text><text x="420" y="213" font-size="18" fill="#183b36">真实上游用调度后的 outputs</text><rect x="772" y="90" width="295" height="140" rx="12" fill="white" stroke="#087e70" stroke-width="2"/><text x="790" y="122" font-size="22" fill="#087e70">共同的阶段</text><text x="790" y="155" font-size="18" fill="#183b36">vote 且 actual → prefill</text><text x="790" y="184" font-size="18" fill="#183b36">否则 → decode</text><text x="790" y="213" font-size="18" fill="#183b36">无本地工作也须保持步型</text><path d="M333 160 L398 160" stroke="#087e70" stroke-width="3" marker-end="url(#a)" fill="none"/><path d="M703 160 L768 160" stroke="#087e70" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="100" y="285" width="900" height="100" rx="12" fill="white" stroke="#087e70" stroke-width="2"/><text x="118" y="317" font-size="22" fill="#087e70">反例：wants=[True, False]，can=[False, True]</text><text x="118" y="350" font-size="18" fill="#183b36">两个 any 都为True，却没有任何rank既想做又能做：actual=False。</text><text x="32" y="436" font-size="18" fill="#183b36">布尔向量是教学模型，不执行 collective，也不证明分布式无死锁。</text></g></svg>
