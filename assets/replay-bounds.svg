<svg xmlns="http://www.w3.org/2000/svg" width="976" height="666" viewBox="0 0 976 666" role="img" aria-labelledby="title desc"><title id="title">滑窗、保留后缀和有效状态的三个下界</title><desc id="desc">长度12、窗口4、保留6。当前位置11看8至11，回退两步后位置9仍需6至9；保留5会缺位置6。有效状态从10开始时，位置11只可读10和11。</desc><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="976" height="666" rx="18" fill="#f3f8f5" stroke="#d8e5de"/><text x="28" y="42" font-size="25" font-weight="700" fill="#183b36">保留后缀，不等于每一行都能看见整个后缀</text><text x="28" y="74" font-size="16" font-weight="400" fill="#526963">data_len = 12 · window = 4 · keep = 6 · backtrack = 2 · 位置从 0 开始</text><text x="28" y="126" font-size="17" font-weight="650" fill="#183b36">绝对位置</text><text x="265" y="126" font-size="17" font-weight="650" fill="#183b36">0</text><text x="321" y="126" font-size="17" font-weight="650" fill="#183b36">1</text><text x="377" y="126" font-size="17" font-weight="650" fill="#183b36">2</text><text x="433" y="126" font-size="17" font-weight="650" fill="#183b36">3</text><text x="489" y="126" font-size="17" font-weight="650" fill="#183b36">4</text><text x="545" y="126" font-size="17" font-weight="650" fill="#183b36">5</text><text x="601" y="126" font-size="17" font-weight="650" fill="#183b36">6</text><text x="657" y="126" font-size="17" font-weight="650" fill="#183b36">7</text><text x="713" y="126" font-size="17" font-weight="650" fill="#183b36">8</text><text x="769" y="126" font-size="17" font-weight="650" fill="#183b36">9</text><text x="825" y="126" font-size="17" font-weight="650" fill="#183b36">10</text><text x="881" y="126" font-size="17" font-weight="650" fill="#183b36">11</text><text x="28" y="178" font-size="17" font-weight="600" fill="#183b36">保留矩形</text><rect x="248" y="146" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="304" y="146" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="360" y="146" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="416" y="146" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="472" y="146" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="528" y="146" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="584" y="146" width="46" height="45" rx="5" fill="#fff1d7" stroke="#98651b"/><text x="601" y="175" font-size="16" font-weight="650" fill="#98651b">6</text><rect x="640" y="146" width="46" height="45" rx="5" fill="#fff1d7" stroke="#98651b"/><text x="657" y="175" font-size="16" font-weight="650" fill="#98651b">7</text><rect x="696" y="146" width="46" height="45" rx="5" fill="#fff1d7" stroke="#98651b"/><text x="713" y="175" font-size="16" font-weight="650" fill="#98651b">8</text><rect x="752" y="146" width="46" height="45" rx="5" fill="#fff1d7" stroke="#98651b"/><text x="769" y="175" font-size="16" font-weight="650" fill="#98651b">9</text><rect x="808" y="146" width="46" height="45" rx="5" fill="#fff1d7" stroke="#98651b"/><text x="825" y="175" font-size="16" font-weight="650" fill="#98651b">10</text><rect x="864" y="146" width="46" height="45" rx="5" fill="#fff1d7" stroke="#98651b"/><text x="881" y="175" font-size="16" font-weight="650" fill="#98651b">11</text><text x="28" y="242" font-size="17" font-weight="600" fill="#183b36">pos = 11 的滑窗</text><rect x="248" y="210" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="304" y="210" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="360" y="210" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="416" y="210" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="472" y="210" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="528" y="210" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="584" y="210" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="640" y="210" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="696" y="210" width="46" height="45" rx="5" fill="#d8f0e8" stroke="#087e70"/><text x="713" y="239" font-size="16" font-weight="650" fill="#087e70">8</text><rect x="752" y="210" width="46" height="45" rx="5" fill="#d8f0e8" stroke="#087e70"/><text x="769" y="239" font-size="16" font-weight="650" fill="#087e70">9</text><rect x="808" y="210" width="46" height="45" rx="5" fill="#d8f0e8" stroke="#087e70"/><text x="825" y="239" font-size="16" font-weight="650" fill="#087e70">10</text><rect x="864" y="210" width="46" height="45" rx="5" fill="#d8f0e8" stroke="#087e70"/><text x="881" y="239" font-size="16" font-weight="650" fill="#087e70">11</text><text x="28" y="306" font-size="17" font-weight="600" fill="#183b36">回退 2 后：pos = 9</text><rect x="248" y="274" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="304" y="274" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="360" y="274" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="416" y="274" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="472" y="274" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="528" y="274" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="584" y="274" width="46" height="45" rx="5" fill="#d8f0e8" stroke="#087e70"/><text x="601" y="303" font-size="16" font-weight="650" fill="#087e70">6</text><rect x="640" y="274" width="46" height="45" rx="5" fill="#d8f0e8" stroke="#087e70"/><text x="657" y="303" font-size="16" font-weight="650" fill="#087e70">7</text><rect x="696" y="274" width="46" height="45" rx="5" fill="#d8f0e8" stroke="#087e70"/><text x="713" y="303" font-size="16" font-weight="650" fill="#087e70">8</text><rect x="752" y="274" width="46" height="45" rx="5" fill="#d8f0e8" stroke="#087e70"/><text x="769" y="303" font-size="16" font-weight="650" fill="#087e70">9</text><rect x="808" y="274" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="864" y="274" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><text x="28" y="370" font-size="17" font-weight="600" fill="#183b36">pos = 11，valid = 10</text><rect x="248" y="338" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="304" y="338" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="360" y="338" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="416" y="338" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="472" y="338" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="528" y="338" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="584" y="338" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="640" y="338" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="696" y="338" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="752" y="338" width="46" height="45" rx="5" fill="#eef2ef" stroke="#d5dfd8"/><rect x="808" y="338" width="46" height="45" rx="5" fill="#f9e3dc" stroke="#a4473d"/><text x="825" y="367" font-size="16" font-weight="650" fill="#a4473d">10</text><rect x="864" y="338" width="46" height="45" rx="5" fill="#f9e3dc" stroke="#a4473d"/><text x="881" y="367" font-size="16" font-weight="650" fill="#a4473d">11</text><rect x="28" y="415" width="444" height="151" rx="10" fill="#fff" stroke="#bad2ca"/><rect x="29" y="416" width="5" height="149" rx="2" fill="#98651b" stroke="#98651b"/><text x="47" y="447" font-size="20" font-weight="650" fill="#183b36">为什么 keep 不能只有 5？</text><text x="47" y="479" font-size="16" font-weight="400" fill="#183b36">keep=5 只保留 7…11</text><text x="47" y="507" font-size="16" font-weight="400" fill="#183b36">回退到 pos=9 仍需窗口 6…9</text><text x="47" y="535" font-size="16" font-weight="400" fill="#183b36">位置 6 已缺失，不能靠 mask 补回来。</text><rect x="500" y="415" width="444" height="151" rx="10" fill="#fff" stroke="#bad2ca"/><rect x="501" y="416" width="5" height="149" rx="2" fill="#a4473d" stroke="#a4473d"/><text x="519" y="447" font-size="20" font-weight="650" fill="#183b36">valid_start 是另一条边界</text><text x="519" y="479" font-size="16" font-weight="400" fill="#183b36">valid_start=10 排除所有位置 &lt;10</text><text x="519" y="507" font-size="16" font-weight="400" fill="#183b36">即使 8、9 在滑窗与保留后缀里</text><text x="519" y="535" font-size="16" font-weight="400" fill="#183b36">也不能读取已经失效的 state。</text><text x="28" y="603" font-size="17" font-weight="650" fill="#183b36">可见范围 = [ max(0, pos−window+1, data_len−keep, valid_start), pos+1 )</text><text x="28" y="635" font-size="16" font-weight="400" fill="#526963">左界超过右界时裁成空集。这里画的是整数位置，不是显存分配、KV 内容或 attention 数值。</text></g></svg>
