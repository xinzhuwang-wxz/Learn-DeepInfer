<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-label="容量、身份、引用：三种信息不能压成一个计数器"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#087e70"/></marker></defs><rect width="1100" height="460" fill="#f2f8f5"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="32" y="44" font-size="28" fill="#183b36">容量、身份、引用：三种信息不能压成一个计数器</text><rect x="32" y="90" width="300" height="130" rx="12" fill="white" stroke="#087e70" stroke-width="2"/><text x="50" y="122" font-size="22" fill="#087e70">准入：需要 n 个块</text><text x="50" y="155" font-size="18" fill="#183b36">n &gt; 可用总量 → NEVER</text><text x="50" y="184" font-size="18" fill="#183b36">n &gt; 当前空闲 → LATER</text><text x="50" y="213" font-size="18" fill="#183b36">否则 → OK</text><rect x="402" y="90" width="300" height="130" rx="12" fill="white" stroke="#087e70" stroke-width="2"/><text x="420" y="122" font-size="22" fill="#087e70">块 i 的所有权</text><text x="420" y="155" font-size="18" fill="#183b36">allocate: refs[i] = 1</text><text x="420" y="184" font-size="18" fill="#183b36">pin: 1 → 2</text><text x="420" y="213" font-size="18" fill="#183b36">first free: 2 → 1</text><rect x="772" y="90" width="295" height="130" rx="12" fill="white" stroke="#087e70" stroke-width="2"/><text x="790" y="122" font-size="22" fill="#087e70">最后一个 owner 退出</text><text x="790" y="155" font-size="18" fill="#183b36">last free: 1 → 0</text><text x="790" y="184" font-size="18" fill="#183b36">此时才可以重分配</text><text x="790" y="213" font-size="18" fill="#183b36">再次 free 必须报错</text><path d="M333 155 L398 155" stroke="#087e70" stroke-width="3" marker-end="url(#a)" fill="none"/><path d="M703 155 L768 155" stroke="#087e70" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="100" y="280" width="900" height="108" rx="12" fill="white" stroke="#087e70" stroke-width="2"/><text x="118" y="312" font-size="22" fill="#087e70">总块数8时只有7个可用：A占3、B占2、C需要3</text><text x="118" y="345" font-size="18" fill="#183b36">空闲2不足以放C → C等候；A完成释放3 → C可以继续。</text><text x="118" y="374" font-size="18" fill="#183b36">block 0 保留；引用归零不是销毁底层 GPU 缓存张量。</text><text x="32" y="436" font-size="18" fill="#183b36">等待并不等于非法；正常结束和异常出口都要结清所有权。</text></g></svg>
