<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="计算路径形状地址精度账"><title>计算路径形状地址精度账</title><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3z" fill="#087a64"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f0f7f3"/><text x="28" y="37" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#17342e" font-weight="600">同一层的三张账：shape / address / precision</text><rect x="28" y="70" width="260" height="80" rx="9" fill="white" stroke="#b9d3c7"/><text x="44" y="100" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#17342e" font-weight="600">Hidden states</text><text x="44" y="126" font-family="Noto Sans CJK SC, sans-serif" font-size="12" fill="#526b64" font-weight="400">N × H · norm / HC</text><rect x="329" y="70" width="258" height="80" rx="9" fill="white" stroke="#b9d3c7"/><text x="345" y="100" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#17342e" font-weight="600">Query 低秩路径</text><text x="345" y="126" font-family="Noto Sans CJK SC, sans-serif" font-size="12" fill="#526b64" font-weight="400">N × R → N × (heads · D)</text><rect x="630" y="70" width="240" height="80" rx="9" fill="white" stroke="#b9d3c7"/><text x="646" y="100" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#17342e" font-weight="600">可见域与 cache</text><text x="646" y="126" font-family="Noto Sans CJK SC, sans-serif" font-size="12" fill="#526b64" font-weight="400">SWA + compressed / index</text><rect x="28" y="200" width="260" height="80" rx="9" fill="white" stroke="#b9d3c7"/><text x="44" y="230" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#17342e" font-weight="600">回到 hidden space</text><text x="44" y="256" font-family="Noto Sans CJK SC, sans-serif" font-size="12" fill="#526b64" font-weight="400">context → Wv / O projection</text><rect x="329" y="200" width="258" height="80" rx="9" fill="white" stroke="#b9d3c7"/><text x="345" y="230" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#17342e" font-weight="600">MoE：逻辑 → 物理</text><text x="345" y="256" font-family="Noto Sans CJK SC, sans-serif" font-size="12" fill="#526b64" font-weight="400">gate → dispatch → experts</text><rect x="630" y="200" width="240" height="80" rx="9" fill="white" stroke="#b9d3c7"/><text x="646" y="230" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#17342e" font-weight="600">Combine + shared</text><text x="646" y="256" font-family="Noto Sans CJK SC, sans-serif" font-size="12" fill="#526b64" font-weight="400">归还原 token 位置</text><line x1="293" y1="110" x2="322" y2="110" stroke="#087a64" stroke-width="2" marker-end="url(#arr)"/><line x1="592" y1="110" x2="623" y2="110" stroke="#087a64" stroke-width="2" marker-end="url(#arr)"/><line x1="293" y1="240" x2="322" y2="240" stroke="#087a64" stroke-width="2" marker-end="url(#arr)"/><line x1="592" y1="240" x2="623" y2="240" stroke="#087a64" stroke-width="2" marker-end="url(#arr)"/><path d="M750 154 V180 H158 V196" fill="none" stroke="#087a64" stroke-width="2" marker-end="url(#arr)"/><text x="28" y="335" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#17342e" font-weight="400">数据与 scale 一起传；物理副本不能改变 logical expert 的函数。</text><text x="28" y="370" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#526b64" font-weight="400">参考实验只算小矩阵与字节账，不包含 V4 压缩、低精度 kernel 或通信。</text></svg>