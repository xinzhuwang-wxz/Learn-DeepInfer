<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-label="身份不变，运行集合和交付顺序不同"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#087e70"/></marker></defs><rect width="1100" height="460" fill="#f2f8f5"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="32" y="44" font-size="28" fill="#183b36">身份不变，运行集合和交付顺序不同</text><rect x="32" y="85" width="300" height="138" rx="12" fill="white" stroke="#087e70" stroke-width="2"/><text x="50" y="117" font-size="22" fill="#087e70">输入 requests</text><text x="50" y="150" font-size="18" fill="#183b36">A → true</text><text x="50" y="179" font-size="18" fill="#183b36">B → false</text><text x="50" y="208" font-size="18" fill="#183b36">C → true</text><rect x="402" y="85" width="300" height="138" rx="12" fill="white" stroke="#087e70" stroke-width="2"/><text x="420" y="117" font-size="22" fill="#087e70">完成顺序</text><text x="420" y="150" font-size="18" fill="#183b36">tick 4: A、C 完成</text><text x="420" y="179" font-size="18" fill="#183b36">tick 5: B 完成</text><text x="420" y="208" font-size="18" fill="#183b36">完成集合不是输出数组</text><rect x="772" y="85" width="295" height="138" rx="12" fill="white" stroke="#087e70" stroke-width="2"/><text x="790" y="117" font-size="22" fill="#087e70">按 requests 取 output</text><text x="790" y="150" font-size="18" fill="#183b36">A → true</text><text x="790" y="179" font-size="18" fill="#183b36">B → false</text><text x="790" y="208" font-size="18" fill="#183b36">C → true</text><path d="M333 155 L398 155" stroke="#087e70" stroke-width="3" marker-end="url(#a)" fill="none"/><path d="M703 155 L768 155" stroke="#087e70" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="100" y="280" width="900" height="100" rx="12" fill="white" stroke="#087e70" stroke-width="2"/><text x="118" y="312" font-size="22" fill="#087e70">running 可以删成员；requests 保留输入顺序</text><text x="118" y="345" font-size="18" fill="#183b36">输出保存在对应 Request 上，不靠完成事件的位置猜身份。</text><text x="32" y="436" font-size="18" fill="#183b36">教学字符 oracle；并发完成顺序不决定调用者交付顺序。</text></g></svg>
