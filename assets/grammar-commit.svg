<svg xmlns="http://www.w3.org/2000/svg" width="1002" height="670" viewBox="0 0 1002 670" role="img" aria-labelledby="title desc"><title id="title">教学提交与上游草稿mask准备的不同边界</title><desc id="desc">教学C请求第13步pending含tr但output和matcher仍为空；第14步提交tr推进语法，第15步flush ue完成。上游sampler则先接收实际提交token，临时接收草稿生成mask，再按实际临时接受步数回退。</desc><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1002" height="670" rx="18" fill="#f3f8f5" stroke="#d8e5de"/><text x="28" y="42" font-size="25" font-weight="700" fill="#183b36">同一批 A/B/C：pending 还没有推进语法状态</text><text x="28" y="74" font-size="16" font-weight="400" fill="#526963">第13步 decode 返回后，C 的 tr 已经在途，但它的 output 与 matcher.prefix 都还是空串。</text><rect x="28" y="110" width="282" height="170" rx="10" fill="#fff" stroke="#bad2ca"/><rect x="29" y="111" width="5" height="168" rx="2" fill="#98651b" stroke="#98651b"/><text x="47" y="142" font-size="20" font-weight="650" fill="#183b36">第13步结束 · C</text><text x="47" y="174" font-size="16" font-weight="400" fill="#183b36">pending: &#x27;tr&#x27;</text><text x="47" y="202" font-size="16" font-weight="400" fill="#183b36">output: &#x27;&#x27;</text><text x="47" y="230" font-size="16" font-weight="400" fill="#183b36">matcher.prefix: &#x27;&#x27;</text><path d="M314,195 L351,195" stroke="#087e70" stroke-width="2.5" fill="none"/><polygon points="351,195 342.0,199.0 342.0,191.0" fill="#087e70"/><rect x="360" y="110" width="282" height="170" rx="10" fill="#fff" stroke="#bad2ca"/><rect x="361" y="111" width="5" height="168" rx="2" fill="#087e70" stroke="#087e70"/><text x="379" y="142" font-size="20" font-weight="650" fill="#183b36">第14步提交 tr</text><text x="379" y="174" font-size="16" font-weight="400" fill="#183b36">accept(&#x27;t&#x27;) → &#x27;t&#x27;</text><text x="379" y="202" font-size="16" font-weight="400" fill="#183b36">accept(&#x27;r&#x27;) → &#x27;tr&#x27;</text><text x="379" y="230" font-size="16" font-weight="400" fill="#183b36">output 追加 &#x27;tr&#x27;</text><path d="M646,195 L683,195" stroke="#087e70" stroke-width="2.5" fill="none"/><polygon points="683,195 674.0,199.0 674.0,191.0" fill="#087e70"/><rect x="692" y="110" width="282" height="170" rx="10" fill="#fff" stroke="#bad2ca"/><rect x="693" y="111" width="5" height="168" rx="2" fill="#087e70" stroke="#087e70"/><text x="711" y="142" font-size="20" font-weight="650" fill="#183b36">第15步 flush ue</text><text x="711" y="174" font-size="16" font-weight="400" fill="#183b36">accept(&#x27;u&#x27;), accept(&#x27;e&#x27;)</text><text x="711" y="202" font-size="16" font-weight="400" fill="#183b36">output: &#x27;true&#x27;</text><text x="711" y="230" font-size="16" font-weight="400" fill="#183b36">matcher.prefix: &#x27;true&#x27;</text><rect x="28" y="313" width="946" height="58" rx="10" fill="#e9f3ef" stroke="#c8dbd2"/><text x="47" y="347" font-size="17" font-weight="600" fill="#183b36">教学主线：用正确 oracle 产出字符，在 emit 前检查；没有草稿拒绝，也不调用 rollback。</text><text x="28" y="416" font-size="22" font-weight="650" fill="#183b36">上游 sampler：为了制作草稿各位置的 mask，临时走进未来，再恢复</text><rect x="28" y="449" width="282" height="150" rx="10" fill="#fff" stroke="#bad2ca"/><rect x="29" y="450" width="5" height="148" rx="2" fill="#087e70" stroke="#087e70"/><text x="47" y="481" font-size="20" font-weight="650" fill="#183b36">持久状态：已提交前缀</text><text x="47" y="513" font-size="16" font-weight="400" fill="#183b36">接收本轮已确认的 token</text><text x="47" y="541" font-size="16" font-weight="400" fill="#183b36">先制作下一位置的 mask</text><text x="47" y="569" font-size="16" font-weight="400" fill="#183b36">记住这次进入前的状态</text><path d="M314,524 L351,524" stroke="#087e70" stroke-width="2.5" fill="none"/><polygon points="351,524 342.0,528.0 342.0,520.0" fill="#087e70"/><rect x="360" y="449" width="282" height="150" rx="10" fill="#fff" stroke="#bad2ca"/><rect x="361" y="450" width="5" height="148" rx="2" fill="#98651b" stroke="#98651b"/><text x="379" y="481" font-size="20" font-weight="650" fill="#183b36">临时推进草稿</text><text x="379" y="513" font-size="16" font-weight="400" fill="#183b36">按顺序 accept draft</text><text x="379" y="541" font-size="16" font-weight="400" fill="#183b36">每步制作对应 vocab mask</text><text x="379" y="569" font-size="16" font-weight="400" fill="#183b36">拒绝后停止继续推进</text><path d="M646,524 L683,524" stroke="#087e70" stroke-width="2.5" fill="none"/><polygon points="683,524 674.0,528.0 674.0,520.0" fill="#087e70"/><rect x="692" y="449" width="282" height="150" rx="10" fill="#fff" stroke="#bad2ca"/><rect x="693" y="450" width="5" height="148" rx="2" fill="#087e70" stroke="#087e70"/><text x="711" y="481" font-size="20" font-weight="650" fill="#183b36">恢复基线</text><text x="711" y="513" font-size="16" font-weight="400" fill="#183b36">rollback(实际接受步数)</text><text x="711" y="541" font-size="16" font-weight="400" fill="#183b36">不是回退全部草稿长度</text><text x="711" y="569" font-size="16" font-weight="400" fill="#183b36">下一轮由真正接受结果推进</text><text x="28" y="640" font-size="17" font-weight="650" fill="#a4473d">两条路径不能混称：教学 emit 检查 ≠ 上游采样前 mask + 推测状态回退。</text></g></svg>
