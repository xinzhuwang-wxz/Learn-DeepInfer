<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="677" viewBox="0 0 1100 677" role="img" aria-labelledby="title desc"><title id="title">逻辑专家物理副本与本地编号</title><desc id="desc">教学gate选逻辑专家0和2，归一化权重七分之六与七分之一，映射到物理槽3和0，分别由rank1 local1和rank0 local0执行。物理槽0和2都是逻辑函数2的副本，不应改变combine结果。</desc><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1100" height="677" rx="18" fill="#f3f8f5" stroke="#d8e5de"/><text x="28" y="42" font-size="25" font-weight="700" fill="#183b36">选的是 logical expert，执行地址是 physical slot</text><text x="28" y="74" font-size="16" font-weight="400" fill="#526963">教学路由：3 个逻辑专家，1 个冗余副本，EP = 2，每个 rank 持有 2 个物理槽。</text><rect x="28" y="110" width="328" height="198" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="29" y="111" width="5" height="196" rx="2" fill="#087e70" stroke="#087e70"/><text x="46" y="140" font-size="19" font-weight="650" fill="#183b36">先选模型函数</text><text x="46" y="171" font-size="16" font-weight="400" fill="#183b36">scores = [0.6, 0.3, 0.1]</text><text x="46" y="198" font-size="16" font-weight="400" fill="#183b36">bias = [0, 0, 0.5]</text><text x="46" y="225" font-size="16" font-weight="400" fill="#183b36">选 logical 0、2</text><text x="46" y="252" font-size="16" font-weight="400" fill="#183b36">原分数归一化 → 6/7、1/7</text><path d="M362,208 L408,208" fill="none" stroke="#087e70" stroke-width="2.5"/><polygon points="408,208 399.0,212.0 399.0,204.0" fill="#087e70"/><rect x="418" y="110" width="260" height="198" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="419" y="111" width="5" height="196" rx="2" fill="#087e70" stroke="#087e70"/><text x="436" y="140" font-size="19" font-weight="650" fill="#183b36">再查物理映射</text><text x="436" y="171" font-size="16" font-weight="400" fill="#183b36">logical 0 → [3]</text><text x="436" y="198" font-size="16" font-weight="400" fill="#183b36">logical 1 → [1]</text><text x="436" y="225" font-size="16" font-weight="400" fill="#183b36">logical 2 → [0, 2]</text><text x="436" y="252" font-size="16" font-weight="400" fill="#183b36">本例各取第一个槽</text><path d="M684,208 L730,208" fill="none" stroke="#087e70" stroke-width="2.5"/><polygon points="730,208 721.0,212.0 721.0,204.0" fill="#087e70"/><rect x="740" y="110" width="332" height="198" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="741" y="111" width="5" height="196" rx="2" fill="#087e70" stroke="#087e70"/><text x="758" y="140" font-size="19" font-weight="650" fill="#183b36">rank / local</text><text x="758" y="171" font-size="16" font-weight="400" fill="#183b36">physical 3 → rank 1, local 1</text><text x="758" y="198" font-size="16" font-weight="400" fill="#183b36">physical 0 → rank 0, local 0</text><text x="758" y="225" font-size="16" font-weight="400" fill="#183b36">rank = physical // 2</text><text x="758" y="252" font-size="16" font-weight="400" fill="#183b36">local = physical % 2</text><rect x="28" y="342" width="505" height="149" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="29" y="343" width="5" height="147" rx="2" fill="#087e70" stroke="#087e70"/><text x="46" y="372" font-size="19" font-weight="650" fill="#183b36">rank 0</text><text x="46" y="403" font-size="16" font-weight="400" fill="#183b36">local 0 / physical 0：F₂ = [1, 1]  ← 选中</text><text x="46" y="430" font-size="16" font-weight="400" fill="#183b36">local 1 / physical 1：F₁ = [0, 2]</text><rect x="555" y="342" width="517" height="149" rx="12" fill="#fff" stroke="#bad2ca"/><rect x="556" y="343" width="5" height="147" rx="2" fill="#087e70" stroke="#087e70"/><text x="573" y="372" font-size="19" font-weight="650" fill="#183b36">rank 1</text><text x="573" y="403" font-size="16" font-weight="400" fill="#183b36">local 0 / physical 2：F₂ = [1, 1]  ← 同函数副本</text><text x="573" y="430" font-size="16" font-weight="400" fill="#183b36">local 1 / physical 3：F₀ = [2, 0]  ← 选中</text><rect x="28" y="521" width="1044" height="88" rx="12" fill="#e8f5ed" stroke="#bad2ca"/><text x="46" y="553" font-size="21" font-weight="650" fill="#183b36">combine = x + (6/7) F₀ + (1/7) F₂</text><text x="46" y="586" font-size="17" font-weight="400" fill="#183b36">x = attention 输出；得到 [2.526904, 0.473096]。把 F₂ 从槽 0 移到槽 2，结果不变。</text><text x="28" y="645" font-size="16" font-weight="400" fill="#526963">真实 gate 使用 sqrtsoftplus / noaux_tc；这里的给定分数与取首副本仅是教学规则。</text></g></svg>
