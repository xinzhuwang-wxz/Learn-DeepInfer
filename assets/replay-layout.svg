<svg xmlns="http://www.w3.org/2000/svg" width="976" height="712" viewBox="0 0 976 712" role="img" aria-labelledby="title desc"><title id="title">full行与compact行的可见集合对应</title><desc id="desc">教学full包含十二行，compact包含后六行，同一绝对位置的可见集合相等。这里只做同一函数的投影自检。上游还要同步更新位置、变长序列边界、SWA pivots、存储映射、压缩key范围以及CP布局。</desc><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="976" height="712" rx="18" fill="#f3f8f5" stroke="#d8e5de"/><text x="28" y="42" font-size="25" font-weight="700" fill="#183b36">同一可见关系，两个行布局</text><text x="28" y="74" font-size="16" font-weight="400" fill="#526963">教学 compare()：整段 12 个位置、保留 6 个位置；没有 tensor 或实际 attention。</text><rect x="28" y="104" width="436" height="147" rx="10" fill="#fff" stroke="#bad2ca"/><rect x="29" y="105" width="5" height="145" rx="2" fill="#087e70" stroke="#087e70"/><text x="47" y="136" font-size="20" font-weight="650" fill="#183b36">full：保留行号 0…11</text><text x="47" y="168" font-size="16" font-weight="400" fill="#183b36">0…5 的可见集合为空</text><text x="47" y="196" font-size="16" font-weight="400" fill="#183b36">6…11 保存对应的 key 位置集合</text><text x="47" y="224" font-size="16" font-weight="400" fill="#183b36">此处 full 是“全行 + 同一截断公式”</text><rect x="512" y="104" width="436" height="147" rx="10" fill="#fff" stroke="#bad2ca"/><rect x="513" y="105" width="5" height="145" rx="2" fill="#087e70" stroke="#087e70"/><text x="531" y="136" font-size="20" font-weight="650" fill="#183b36">compact：只列行号 6…11</text><text x="531" y="168" font-size="16" font-weight="400" fill="#183b36">行号仍是原绝对位置</text><text x="531" y="196" font-size="16" font-weight="400" fill="#183b36">不是把位置 6 改名成位置 0</text><text x="531" y="224" font-size="16" font-weight="400" fill="#183b36">检查保留行的可见集合相同</text><path d="M468,179 L505,179" stroke="#087e70" stroke-width="2.5" fill="none"/><polygon points="505,179 496.0,183.0 496.0,175.0" fill="#087e70"/><rect x="28" y="274" width="920" height="35" rx="6" fill="#fff" stroke="#d7e4dd"/><text x="48" y="298" font-size="16" font-weight="650" fill="#183b36">full[6]</text><text x="240" y="298" font-size="16" font-weight="400" fill="#183b36">6</text><text x="492" y="298" font-size="18" font-weight="650" fill="#087e70">=</text><text x="568" y="298" font-size="16" font-weight="650" fill="#183b36">compact[6]</text><rect x="28" y="316" width="920" height="35" rx="6" fill="#fff" stroke="#d7e4dd"/><text x="48" y="340" font-size="16" font-weight="650" fill="#183b36">full[7]</text><text x="240" y="340" font-size="16" font-weight="400" fill="#183b36">6, 7</text><text x="492" y="340" font-size="18" font-weight="650" fill="#087e70">=</text><text x="568" y="340" font-size="16" font-weight="650" fill="#183b36">compact[7]</text><rect x="28" y="358" width="920" height="35" rx="6" fill="#fff" stroke="#d7e4dd"/><text x="48" y="382" font-size="16" font-weight="650" fill="#183b36">full[8]</text><text x="240" y="382" font-size="16" font-weight="400" fill="#183b36">6, 7, 8</text><text x="492" y="382" font-size="18" font-weight="650" fill="#087e70">=</text><text x="568" y="382" font-size="16" font-weight="650" fill="#183b36">compact[8]</text><rect x="28" y="400" width="920" height="35" rx="6" fill="#fff" stroke="#d7e4dd"/><text x="48" y="424" font-size="16" font-weight="650" fill="#183b36">full[9]</text><text x="240" y="424" font-size="16" font-weight="400" fill="#183b36">6, 7, 8, 9</text><text x="492" y="424" font-size="18" font-weight="650" fill="#087e70">=</text><text x="568" y="424" font-size="16" font-weight="650" fill="#183b36">compact[9]</text><rect x="28" y="442" width="920" height="35" rx="6" fill="#fff" stroke="#d7e4dd"/><text x="48" y="466" font-size="16" font-weight="650" fill="#183b36">full[10]</text><text x="240" y="466" font-size="16" font-weight="400" fill="#183b36">7, 8, 9, 10</text><text x="492" y="466" font-size="18" font-weight="650" fill="#087e70">=</text><text x="568" y="466" font-size="16" font-weight="650" fill="#183b36">compact[10]</text><rect x="28" y="484" width="920" height="35" rx="6" fill="#fff" stroke="#d7e4dd"/><text x="48" y="508" font-size="16" font-weight="650" fill="#183b36">full[11]</text><text x="240" y="508" font-size="16" font-weight="400" fill="#183b36">8, 9, 10, 11</text><text x="492" y="508" font-size="18" font-weight="650" fill="#087e70">=</text><text x="568" y="508" font-size="16" font-weight="650" fill="#183b36">compact[11]</text><rect x="28" y="548" width="920" height="64" rx="10" fill="#fff5e5" stroke="#d7b77c"/><text x="47" y="575" font-size="18" font-weight="650" fill="#98651b">这只是同一函数的投影自检，不是独立实现之间的数值等价证明。</text><text x="47" y="599" font-size="16" font-weight="400" fill="#526963">没有证明 store slot、压缩 key、CP 重排或模型输出相同。</text><text x="28" y="651" font-size="16" font-weight="650" fill="#183b36">上游 compact 要一起更换：positions · cu_seqlens · SWA pivots · store mapping · 压缩 key 范围</text><text x="28" y="684" font-size="16" font-weight="400" fill="#526963">真实分 chunk 还有占位行；CP&gt;1 还要重分布。不能只对 hidden_states 切片。</text></g></svg>
