<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-label="三本账：计划、交付、调度各用自己的单位"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#087e70"/></marker></defs><rect width="1100" height="460" fill="#f2f8f5"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="32" y="44" font-size="28" fill="#183b36">三本账：计划、交付、调度各用自己的单位</text><rect x="32" y="100" width="300" height="145" rx="12" fill="white" stroke="#087e70" stroke-width="2"/><text x="50" y="132" font-size="22" fill="#087e70">计划：14个验证位置</text><text x="50" y="165" font-size="18" fill="#183b36">sum(query_lengths)</text><text x="50" y="194" font-size="18" fill="#183b36">采样之前记账</text><text x="50" y="223" font-size="18" fill="#183b36">B末尾计划2，实际剩1</text><rect x="402" y="100" width="300" height="145" rx="12" fill="white" stroke="#087e70" stroke-width="2"/><text x="420" y="132" font-size="22" fill="#087e70">提交：13个字符</text><text x="420" y="165" font-size="18" fill="#183b36">len(true)+len(false)</text><text x="420" y="194" font-size="18" fill="#183b36">+len(true) = 4+5+4</text><text x="420" y="223" font-size="18" fill="#183b36">pending排空后才结清</text><rect x="772" y="100" width="295" height="145" rx="12" fill="white" stroke="#087e70" stroke-width="2"/><text x="790" y="132" font-size="22" fill="#087e70">调度：15个逻辑tick</text><text x="790" y="165" font-size="18" fill="#183b36">包含prefill与decode</text><text x="790" y="194" font-size="18" fill="#183b36">包含最终flush</text><text x="790" y="223" font-size="18" fill="#183b36">不是15秒或15次kernel</text><path d="M333 175 L398 175" stroke="#087e70" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="100" y="300" width="900" height="90" rx="12" fill="white" stroke="#087e70" stroke-width="2"/><text x="118" y="332" font-size="22" fill="#087e70">最终验收同时看内容与生命周期</text><text x="118" y="365" font-size="18" fill="#183b36">输出 true / false / true；pending=[]；活引用=0；finished含A/B/C。</text><text x="32" y="436" font-size="18" fill="#183b36">14 / 15 不能命名 tokens/s：分子是位置，分母不是时间。</text></g></svg>
